<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disaster Terrain Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="loading" id="loading">Building terrain…</div>
<canvas id="c" aria-label="3D disaster terrain scene"></canvas>

<header class="top">
  <section class="card info" id="info" aria-live="polite">
    <div class="card-head">
      <span class="mode-icon" id="mIcon" aria-hidden="true"></span>
      <div>
        <h1 id="mName">Disaster</h1>
        <p class="status" id="mStatus"></p>
      </div>
      <button class="ghost" id="toggleInfo" aria-expanded="true" aria-controls="infoBody">Less</button>
    </div>
    <div class="card-body" id="infoBody">
      <p id="mDesc"></p>
      <p class="tip"><strong>If this happens:</strong> <span id="mTip"></span></p>
      <ul class="legend">
        <li><i class="sw vic"></i>Unconscious survivor, needs help</li>
      </ul>
      <p class="count">Unconscious survivors on the map: <b id="waiting">0</b></p>
    </div>
  </section>
  <section class="card controls" aria-label="Scene controls">
    <label class="range"><span>Intensity</span><input type="range" id="intensity" min="0.3" max="1.8" step="0.05" value="1"></label>
    <div class="btns">
      <button class="chip" id="bPeople" aria-pressed="true">People</button>
      <button class="chip" id="bRotate" aria-pressed="true">Auto-rotate</button>
      <button class="chip" id="bPause" aria-pressed="false">Pause</button>
      <button class="chip" id="bReset">Reset view</button>
    </div>
  </section>
</header>

<nav class="dock" aria-label="Disaster type"><div class="dock-inner" id="dock"></div></nav>
<p class="hint">Drag to orbit, scroll or pinch to zoom, press 1–8 to switch disasters</p>

<script src="libs/three.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
